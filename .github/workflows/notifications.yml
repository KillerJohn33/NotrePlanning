# Envoi des notifications de Notre Planning (rappels, changements de l'autre, résumé de 7h).
# Secrets requis : FIREBASE_SERVICE_ACCOUNT (clé JSON d'un compte de service Firebase),
# VAPID_PUBLIC_KEY et VAPID_PRIVATE_KEY (clés Web Push).
name: Notifications

on:
  schedule:
    - cron: '*/10 * * * *'   # toutes les 10 min (GitHub peut décaler de quelques minutes)
  workflow_dispatch:          # lancement manuel depuis l'onglet Actions

concurrency:
  group: notifications
  cancel-in-progress: false

permissions:
  contents: write             # pour le « maintien en vie » ci-dessous

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      # Tant que la clé Firebase n'est pas configurée, la tâche ne fait rien (et n'échoue pas).
      - name: Vérifier la configuration
        id: cfg
        run: echo "ready=${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 20
      - name: Installer les dépendances
        if: steps.cfg.outputs.ready == 'true'
        working-directory: notifier
        run: npm install --no-audit --no-fund --omit=dev
      - name: Envoyer les notifications
        if: steps.cfg.outputs.ready == 'true'
        working-directory: notifier
        run: node notify.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      # GitHub suspend les tâches planifiées d'un dépôt sans activité depuis 60 jours :
      # un commit vide est poussé si le dernier commit date de plus de 45 jours.
      - name: Maintenir la tâche active
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Maintien de la tâche de notifications"
            git push
          fi
