# Programmes de sport à la télé : lit le guide TV (xmltvfr.fr) et ajoute dans tvEvents les
# programmes qui correspondent aux mots-clés de chacun (⚙ Réglages → Sport à la télé).
# Secret requis : FIREBASE_SERVICE_ACCOUNT (le même que pour les notifications).
name: Sport à la télé

on:
  schedule:
    - cron: '23 4 * * *'    # chaque matin (heure UTC)
    - cron: '23 15 * * *'   # et chaque après-midi, pour les changements de programme
  workflow_dispatch:        # lancement manuel depuis l'onglet Actions

concurrency:
  group: sport-tv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration
        id: cfg
        run: echo "ready=${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 20
      - name: Installer les dépendances
        if: steps.cfg.outputs.ready == 'true'
        working-directory: notifier
        run: npm install --no-audit --no-fund --omit=dev
      - name: Mettre à jour les programmes
        if: steps.cfg.outputs.ready == 'true'
        working-directory: notifier
        run: node sport-tv.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
